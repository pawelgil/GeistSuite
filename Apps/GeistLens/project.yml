name: GeistLens
options:
  bundleIdPrefix: com.geistlens
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
packages:
  Geist:
    path: ../..
targets:
  GeistLens:
    type: application
    platform: macOS
    sources:
      - path: Sources/StatusBar
      - path: Sources/Shared
      - path: Resources/Icons
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: GeistLens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSCameraUsageDescription: "GeistLens forwards your Mac camera into iOS Simulator apps."
        NSMicrophoneUsageDescription: "GeistLens forwards your Mac microphone into iOS Simulator apps."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistlens.geistlens
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: GeistLens
    dependencies:
      - package: Geist
        product: GeistKit
      - package: Geist
        product: GeistCamera
      - target: GeistLensCLI
        embed: true
        copy:
          destination: sharedSupport
          # Lives at Contents/SharedSupport/geistlens. Can't share Contents/MacOS/
          # with GeistLens — APFS is case-insensitive so geistlens overwrites it.
      - target: GeistLensTrampoline
        embed: true
        copy:
          destination: sharedSupport
  GeistLensCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
      - path: Sources/Shared
    settings:
      base:
        # Binary name is lowercase `geistlens` so users invoke it as such.
        # Module name is kept case-distinct from `GeistLens` (the .app target)
        # because APFS folds `geistlens.swiftmodule/` and `GeistLens.swiftmodule/`
        # into a single directory and breaks `@testable import GeistLens`.
        PRODUCT_NAME: geistlens
        PRODUCT_MODULE_NAME: GeistLensCLI
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
  GeistLensTrampoline:
    # 30-line C forwarder; installed into PATH as `geistlens` so users can
    # move GeistLens.app freely without breaking the symlink.
    type: tool
    platform: macOS
    sources:
      - path: Sources/Trampoline
    settings:
      base:
        PRODUCT_NAME: geistlens-trampoline
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: -framework CoreServices
  GeistLensTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests
    dependencies:
      - target: GeistLens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistlens.geistlens.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
