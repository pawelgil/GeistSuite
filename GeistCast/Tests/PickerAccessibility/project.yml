name: PickerAccessibility
options:
  deploymentTarget:
    iOS: "18.0"
targets:
  PickerTestHost:
    type: application
    platform: iOS
    sources:
      - path: PickerTestHost.swift
      - path: PickerTestSceneDelegate.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistcast.picker-test-host
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
  PickerAccessibilityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickerAccessibilityTests.swift
      - path: ../../Sources/GeistBroadcastAppShim/PickerUI/PickerControls.m
      - path: ../../Sources/GeistBroadcastAppShim/PickerUI/GCDismissBackdropView.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistcast.picker-accessibility-tests
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: PickerAccessibility-Bridging-Header.h
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PickerTestHost.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PickerTestHost
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PickerTestHost
schemes:
  PickerAccessibility:
    build:
      targets:
        PickerAccessibilityTests: all
    test:
      targets:
        - PickerAccessibilityTests
