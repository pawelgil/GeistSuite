name: GeistCast
options:
  bundleIdPrefix: com.geistcast
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
packages:
  Geist:
    path: ../..
targets:
  GeistCast:
    type: application
    platform: macOS
    sources:
      - path: Sources/StatusBar
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: GeistCast
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "GeistCast forwards the Mac microphone into the iOS simulator's broadcast extension when you enable the mic toggle in the broadcast picker."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistcast.geistcast
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Geist
        product: GeistBroadcast
      - target: GeistCastCLI
        embed: true
        copy:
          destination: sharedSupport
  GeistCastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: GeistCast
      - package: Geist
        product: GeistBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geistcast.geistcast.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
  GeistCastCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_NAME: geistcast
        PRODUCT_MODULE_NAME: GeistCastCLI
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
    dependencies:
      - package: Geist
        product: GeistBroadcast
