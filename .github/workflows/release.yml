name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  XCODE_VERSION: latest-stable

jobs:
  build:
    name: Build & notarize ${{ matrix.app }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: GeistCast
            app-dir: GeistCast/App
            project: GeistCast/App/GeistCast.xcodeproj
            scheme: GeistCast
          - app: GeistLens
            app-dir: GeistLens/App
            project: GeistLens/App/GeistLens.xcodeproj
            scheme: GeistLens
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate ${{ matrix.app }}.xcodeproj
        run: xcodegen generate
        working-directory: ${{ matrix.app-dir }}

      - name: Import Developer ID certificate
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk '{print $2}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "No Developer ID Application identity found"; exit 1
          fi
          echo "DEVELOPER_ID_HASH=$IDENTITY_HASH" >> "$GITHUB_ENV"

      - name: Archive ${{ matrix.app }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/${{ matrix.app }}.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application"

      - name: Export ${{ matrix.app }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ matrix.app }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export-${{ matrix.app }}" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Create DMG
        run: |
          set -euo pipefail
          brew install create-dmg
          APP_PATH="$RUNNER_TEMP/export-${{ matrix.app }}/${{ matrix.app }}.app"
          DMG_PATH="$RUNNER_TEMP/${{ matrix.app }}.dmg"
          create-dmg \
            --volname "${{ matrix.app }}" \
            --window-size 540 380 \
            --icon-size 120 \
            --icon "${{ matrix.app }}.app" 140 200 \
            --app-drop-link 400 200 \
            --hdiutil-quiet \
            "$DMG_PATH" "$APP_PATH"

      - name: Sign DMG
        run: |
          set -euo pipefail
          codesign --force --sign "$DEVELOPER_ID_HASH" \
            --timestamp \
            "$RUNNER_TEMP/${{ matrix.app }}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$RUNNER_TEMP/${{ matrix.app }}.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/${{ matrix.app }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dmg
          path: ${{ runner.temp }}/${{ matrix.app }}.dmg
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/GeistCast.dmg
            artifacts/GeistLens.dmg
