name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: '26.4'

jobs:
  package:
    name: Swift package
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: swift build
        run: swift build
      - name: swift test
        # `swift test` runs all SPM test targets in one xctest process. Many
        # broadcast and camera tests open Unix-domain sockets and use accept()
        # to exercise the wire protocol; under `--parallel` the kernel accept
        # queue and Swift Testing's scheduler interact pathologically and
        # accept loops block on connections the test has already moved past.
        # Serial execution finishes in ~4s — fast enough that parallelism
        # isn't worth the audit it would take to fix every accept-loop suite.
        # Job-level `timeout-minutes: 10` protects against any future regression.
        run: swift test --no-parallel

  app:
    name: ${{ matrix.app }} app build
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: GeistCast
            app-dir: GeistCast/App
            project: GeistCast/App/GeistCast.xcodeproj
            scheme: GeistCast
          - app: GeistLens
            app-dir: GeistLens/App
            project: GeistLens/App/GeistLens.xcodeproj
            scheme: GeistLens
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate ${{ matrix.app }}.xcodeproj
        run: xcodegen generate
        working-directory: ${{ matrix.app-dir }}
      - name: Build ${{ matrix.app }}
        run: |
          xcodebuild build \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
